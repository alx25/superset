<svg viewBox='-36 -25 72 50' xmlns='http://www.w3.org/2000/svg' overflow='visible'>
  <defs>
    <filter id='shadow1' x='-50%' y='-50%' width='200%' height='200%'>
      <feDropShadow dx='1' dy='1' stdDeviation='2.4' flood-color='rgba(0,0,0,0.35)' />
    </filter>
    <filter id='greenGlow' x='-80%' y='-80%' width='260%' height='260%'>
      <feDropShadow dx='0' dy='0' stdDeviation='1.8' flood-color='rgba(128,255,128,0.45)' />
    </filter>
    <linearGradient id='blueStroke' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='rgb(16, 55, 145)' />
      <stop offset='100%' stop-color='rgb(42, 96, 205)' />
    </linearGradient>
    <linearGradient id='greenStroke' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='rgb(116, 214, 56)' />
      <stop offset='100%' stop-color='rgb(45, 166, 63)' />
    </linearGradient>
    <path id='morphPath' d='M 0,0 C 7,16 22,8.7 22,0 22,-8.7 7,-16 0,0 -7,16 -22,8.7 -22,-0 -22,-8.7 -7,-16 0,0 Z' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='transparent' filter='url(#shadow1)'>
      <animate attributeName='d' dur='6.8s' repeatCount='indefinite' calcMode='spline' keySplines='.45 0 .2 1; .45 0 .2 1; .45 0 .2 1; .45 0 .2 1' values='M 0,0 C 7,16 22,8.7 22,0 22,-8.7 7,-16 0,0 -7,16 -22,8.7 -22,0 -22,-8.7 -7,-16 0,0 Z;M 0,-15 C 8,-15 15,-8 15,0 15,8 8,15 0,15 -8,15 -15,8 -15,0 -15,-8 -8,-15 0,-15 Z;M 0,0 C 7,-16 22,-8.7 22,0 22,8.7 7,16 0,0 -7,-16 -22,-8.7 -22,0 -22,8.7 -7,16 0,0 Z;M 0,15 C 8,15 15,8 15,0 15,-8 8,-15 0,-15 -8,-15 -15,-8 -15,0 -15,8 -8,15 0,15 Z;M 0,0 C 7,16 22,8.7 22,0 22,-8.7 7,-16 0,0 -7,16 -22,8.7 -22,0 -22,-8.7 -7,-16 0,0 Z' keyTimes='0;0.25;0.5;0.75;1' />
    </path>
  </defs>
  <g>
    <animateTransform attributeName='transform' type='scale' values='1;1.015;1' dur='3.2s' repeatCount='indefinite' />
    <use href='#morphPath' stroke='url(#blueStroke)' opacity='0.96'>
      <animate attributeName='opacity' values='0.9;1;0.9' dur='2.8s' repeatCount='indefinite' />
    </use>
    <use href='#morphPath' stroke='url(#greenStroke)' stroke-width='4.5' stroke-linecap='round' stroke-dasharray='26 86' opacity='0.92' filter='url(#greenGlow)'>
      <animate attributeName='stroke-dashoffset' values='0;-112' dur='1.25s' repeatCount='indefinite' />
      <animate attributeName='opacity' values='0.72;1;0.72' dur='1.8s' repeatCount='indefinite' />
      <animate attributeName='stroke-width' values='4;5.2;4' dur='1.8s' repeatCount='indefinite' />
    </use>
  </g>
</svg>
